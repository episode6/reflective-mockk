# Recovers the GPG_KEY secret as an encrypted, downloadable artifact.
#
# Manual-dispatch only. The key is piped straight from the environment into
# gpg's stdin and never written to the filesystem — the only file this job
# creates is the encrypted one it uploads.
#
# IMPORTANT: this repo is public, so the uploaded artifact is downloadable by
# anyone who can see the workflow run. The GPG_EXFIL passphrase is the ONLY
# thing protecting the key. Delete this workflow once the key is recovered.
#
# Decryption instructions: RECOVER_GPG_KEY.md
name: Exfil GPG Key
on:
  workflow_dispatch:
permissions: {}
jobs:
  exfil:
    runs-on: ubuntu-latest
    # Only the repo owner, and only on the canonical repo — never on a fork.
    if: github.repository == 'episode6/reflective-mockk' && github.actor == github.repository_owner
    steps:
      # Deliberately no actions/checkout: this job needs no repo code, and not
      # checking out means no build script can observe the key.
      - name: Encrypt GPG key
        shell: bash
        env:
          # Passing secrets via env rather than inlining ${{ }} into the script
          # keeps them out of the on-disk script file and the process table.
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_EXFIL: ${{ secrets.GPG_EXFIL }}
        run: |
          set -euo pipefail
          umask 077

          ENC="$RUNNER_TEMP/gpg_key_enc.gpg"

          # Only remove the ciphertext if we're bailing out — never leave a
          # truncated or unverified file behind for the upload step.
          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              rm -f "$ENC"
            fi
          }
          trap cleanup EXIT

          if [ -z "${GPG_KEY:-}" ]; then
            echo "::error::GPG_KEY secret is empty or unset"
            exit 1
          fi
          if [ -z "${GPG_EXFIL:-}" ]; then
            echo "::error::GPG_EXFIL secret is empty or unset"
            exit 1
          fi

          gpg --version | head -2

          # The key goes in on stdin and the passphrase on fd 3, both through
          # kernel pipes: printf is a bash builtin (nothing in the process
          # table) and process substitution is a pipe, not a temp file. Note
          # that a here-string would NOT be safe here — bash spools <<< to a
          # file under /tmp.
          #
          # AES-256 is the strongest cipher GnuPG offers; SHA-512 with the
          # maximum s2k count (65011712) is the strongest key derivation it
          # offers. Compression is disabled so the ciphertext is a pure
          # function of the input.
          printf '%s\n' "$GPG_KEY" | gpg \
            --batch --yes \
            --no-symkey-cache \
            --pinentry-mode loopback \
            --passphrase-fd 3 \
            --symmetric \
            --cipher-algo AES256 \
            --digest-algo SHA512 \
            --s2k-mode 3 \
            --s2k-digest-algo SHA512 \
            --s2k-count 65011712 \
            --compress-algo none \
            --output "$ENC" \
            3< <(printf '%s' "$GPG_EXFIL")

          if [ ! -s "$ENC" ]; then
            echo "::error::Encrypted file was not produced"
            exit 1
          fi

          # Round-trip check: confirm the ciphertext actually decrypts back to
          # the key before we rely on it. Both hashes are computed over pipes,
          # so the decrypted key is never written out either.
          PLAIN_SHA="$(printf '%s\n' "$GPG_KEY" | sha256sum | cut -d' ' -f1)"
          ROUNDTRIP_SHA="$(gpg \
            --batch --yes \
            --no-symkey-cache \
            --pinentry-mode loopback \
            --passphrase-fd 3 \
            --decrypt "$ENC" \
            3< <(printf '%s' "$GPG_EXFIL") 2>/dev/null | sha256sum | cut -d' ' -f1)"

          if [ "$PLAIN_SHA" != "$ROUNDTRIP_SHA" ]; then
            echo "::error::Round-trip decryption did not match the key"
            exit 1
          fi

          # A SHA-256 of a high-entropy private key is not a meaningful
          # disclosure, and it lets you verify the file you decrypt locally.
          echo "Plaintext SHA-256: $PLAIN_SHA"
          echo "Encrypted bytes: $(stat -c%s "$ENC")"

      - name: Upload encrypted key
        uses: actions/upload-artifact@v7
        with:
          name: gpg-key-encrypted
          path: ${{ runner.temp }}/gpg_key_enc.gpg
          if-no-files-found: error
          compression-level: 0
          # Shortest window GitHub allows — download it promptly, then delete
          # the artifact and this workflow.
          retention-days: 1
